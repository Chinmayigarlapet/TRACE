
services:
  postgres:
    image: postgres:16-alpine
    container_name: trace-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: trace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trace_dev_password}
      POSTGRES_DB: trace

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trace -d trace"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
